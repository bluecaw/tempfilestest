services:
  # Web Backend Service (Django API)
  - type: web
    name: report-django-backend
    plan: free
    env: python
    buildCommand: bash build.sh
    startCommand: cd backend && gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: report-postgres-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://report-react-frontend.onrender.com
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false

  # Frontend Static Site (Vite React)
  - type: web
    name: report-react-frontend
    plan: free
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://report-django-backend.onrender.com/api

databases:
  - name: report-postgres-db
    plan: free
    databaseName: report_db
    user: report_user